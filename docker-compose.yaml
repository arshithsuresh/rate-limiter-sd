services:
  gateway:
    image: nginx:alpine
    ports:
      - 3000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - prod_api
    networks:
      - prod-network
  prod_api:
    image: items-api:latest
    deploy:
      replicas: 3
      restart-policy:
        condition: on-failure
    expose:
      - "3000"
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge