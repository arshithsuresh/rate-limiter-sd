services:
  gateway:
    image: nginx:alpine
    env_file:
      - api.env
    ports:
      - 3000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - prod_api
    networks:
      - prod-network
  prod_api:
    image: items-api:latest
    env_file:
      - api.env
    deploy:
      replicas: 3
    restart: on-failure
    expose:
      - $API_PORT
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge