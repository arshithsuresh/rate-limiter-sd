services:
  gateway:
    image: nginx:alpine
    environment:
      - API_PORT=3005
    ports:
      - 3000:80
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - prod_api
    networks:
      - prod-network
  prod_api:
    image: items-api:latest
    env_file:
      - api.env
    deploy:
      replicas: 3
    restart: on-failure
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge